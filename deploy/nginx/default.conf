# nginx server block for the OpenWalk static bundle.
# TLS terminates at the Cloudflare edge or the Vite dev server, never here.

server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # Health endpoint for Docker and Swarm healthchecks. Never logged.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite names bundled assets with a content hash, so they can be cached
    # forever; a new build produces new names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else: serve the file if it exists, otherwise 404.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/geo+json image/svg+xml;
    gzip_min_length 1024;
}
