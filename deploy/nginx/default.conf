# nginx server block for the OpenWalk static bundle.
# TLS terminates at the Cloudflare edge or the Vite dev server, never here.

server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # Health endpoint for Docker and Swarm healthchecks. Never logged.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite names bundled assets with a content hash, so they can be cached
    # forever; a new build produces new names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The map library's worker is an ES module file (.mjs), which nginx's MIME
    # table does not know; browsers refuse to run a module served as anything
    # but JavaScript.
    location ~ ^/assets/.+\.mjs$ {
        types { }
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Base map glyphs and sprites change only with the app, so a day's cache is safe.
    location /basemap/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Site data. The map archive is read by range requests, which nginx answers
    # for static files on its own; the files are revalidated on every load so a
    # redeployed site shows at once.
    location /sites/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # The web app manifest has no entry in nginx's MIME table, so it would be
    # sent as application/octet-stream; with nosniff the browser then refuses to
    # read it as a manifest and the app cannot be installed.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Everything else: a file if one exists, otherwise the app, which reads the
    # site from the path (/s/<site-id>/).
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/geo+json image/svg+xml;
    gzip_min_length 1024;
}
