# Continuous integration: every push and pull request runs the same checks a
# developer runs locally with `npm run check`, then builds the nginx image to
# prove the Dockerfile still works. Nothing is published.
name: CI

# A pull request's branch is checked once, by the pull request; pushes are
# checked only on main, so the same commit is not run twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, format, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly what package-lock.json says and fails if the
      # lockfile and package.json disagree, which is what CI should do.
      - run: npm ci --no-audit --no-fund

      - run: npm run check

  image:
    name: Build web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/web.Dockerfile
          push: false
          tags: openwalk/web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    # The job normally takes about three minutes. A step that waits on the
    # network can stall for hours; this makes it fail soon enough to be retried.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      # The two browser engines the tests use, with the system libraries they need.
      # This downloads from the network, so it comes before the app's containers
      # and their network are started.
      - run: npx playwright install --with-deps chromium webkit
        working-directory: e2e

      # The tests drive the app as it is really served: the nginx image, built
      # with the example site. --wait returns once the container reports healthy.
      - run: docker compose -f deploy/compose.yaml up --build --detach --wait

      - run: npm run test:e2e

      # On failure, keep the report and the recordings of what the browser did.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  pipeline:
    name: Pipeline typecheck and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tools/pipeline/pyproject.toml

      - run: pip install -e '.[dev]'

      - run: pyright

      - run: pytest

      # The example site is built from its committed OpenStreetMap snapshot; the
      # generated files must match what is committed.
      - run: openwalk-pipeline build ../../sites/tuscawilla-park

      - run: git diff --exit-code -- ../../sites
