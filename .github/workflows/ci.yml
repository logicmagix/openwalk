# Continuous integration: every push and pull request runs the same checks a
# developer runs locally with `npm run check`, then builds the images a release
# publishes and checks that a site built from them serves. Nothing is published.
name: CI

# A pull request's branch is checked once, by the pull request; pushes are
# checked only on main, so the same commit is not run twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, format, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly what package-lock.json says and fails if the
      # lockfile and package.json disagree, which is what CI should do.
      - run: npm ci --no-audit --no-fund

      - run: npm run check

  image:
    name: Build web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same script a release runs, without the scan and without
      # publishing: the two images are built, the example site is put into them
      # the way a site's own repository would, and the result must serve.
      - run: SCAN=no deploy/release.sh ci
        timeout-minutes: 15

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    # The tests themselves take about ten minutes and grow with the app, so the
    # job is given room for a slow day. The steps that wait on the network,
    # which can stall for hours, carry shorter limits of their own, so a stall
    # still fails soon enough to be retried.
    timeout-minutes: 40
    env:
      # Playwright's own image, which already holds the browser engines and the
      # system libraries they need, so nothing is installed here. Its version
      # must match @playwright/test in e2e/package.json.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5

      # The tests drive the app as it is really served: the nginx image, built
      # with the example site. --wait returns once the container reports healthy.
      - run: docker compose -f deploy/compose.yaml up --build --detach --wait
        timeout-minutes: 10

      # The image is one large download; a dropped connection is tried again
      # before the job gives up.
      - name: Fetch the browser image
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            docker pull "$PLAYWRIGHT_IMAGE" && exit 0
            echo "Pull failed (attempt $attempt of 3); trying again in 15 seconds."
            sleep 15
          done
          exit 1

      # The tests run inside that image. --network host lets them reach the app
      # on localhost; --ipc=host gives the browsers the shared memory they expect.
      - name: Run the browser tests
        timeout-minutes: 30
        run: >
          docker run --rm --network host --ipc=host
          --volume "$PWD":/work --workdir /work
          --env CI=true
          "$PLAYWRIGHT_IMAGE"
          npm run test:e2e

      # On failure, keep the report and the recordings of what the browser did.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  pipeline:
    name: Pipeline typecheck and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tools/pipeline/pyproject.toml

      - run: pip install -e '.[dev]'

      - run: pyright

      - run: pytest

      # The example site is built from its committed OpenStreetMap snapshot; the
      # generated files must match what is committed.
      - run: openwalk-pipeline build ../../sites/tuscawilla-park

      - run: git diff --exit-code -- ../../sites
