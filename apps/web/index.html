<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>OpenWalk</title>
  </head>
  <body>
    <div id="map" role="application" aria-label="Map"></div>

    <div id="nearest" class="nearest" role="group" aria-label="Find the nearest" hidden></div>

    <div id="search" class="search">
      <input
        id="search-input"
        type="search"
        role="combobox"
        aria-label="Search for a place"
        aria-autocomplete="list"
        aria-expanded="false"
        aria-controls="search-list"
        placeholder="Search places"
        autocomplete="off"
        disabled
      />
      <ul id="search-list" role="listbox" aria-label="Places" hidden></ul>
    </div>

    <button id="locate" type="button" aria-label="Show my location" aria-pressed="false" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A8.99 8.99 0 0 0 13 3.06V1h-2v2.06A8.99 8.99 0 0 0 3.06 11H1v2h2.06A8.99 8.99 0 0 0 11 20.94V23h2v-2.06A8.99 8.99 0 0 0 20.94 13H23v-2h-2.06zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"
        />
      </svg>
    </button>

    <section id="panel" class="panel" aria-label="Directions" aria-live="polite" hidden>
      <div id="panel-arrow" class="panel-arrow" aria-hidden="true" hidden>
        <svg viewBox="0 0 24 24"><path d="M12 2 4 20l8-4 8 4z" /></svg>
      </div>
      <div class="panel-text">
        <h2 id="panel-name"></h2>
        <p id="panel-detail" hidden></p>
        <p id="panel-status"></p>
        <button id="panel-action" type="button" hidden>Turn on location</button>
      </div>
      <button id="panel-close" type="button" aria-label="Close directions">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"
          />
        </svg>
      </button>
    </section>

    <p id="status" role="status" aria-live="polite" hidden></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
