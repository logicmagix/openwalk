# The example site: a public park, used to demonstrate and test the pipeline.
# Schema: packages/schema/schemas/site.schema.json.
id: tuscawilla-park
name: Tuscawilla Park
# Named on the privacy page as who runs this map, with how to reach them.
operator:
  name: the OpenWalk project
  url: https://github.com/logicmagix/openwalk
boundary:
  # The park's grounds as mapped in OpenStreetMap (leisure=park).
  osm_way: 462341602
view:
  center: [-82.1322, 29.1927]
  zoom: 17
units: imperial
nearest:
  # The park's two picnic shelters are the category with more than one place, so
  # "nearest" has a real choice to make.
  - { category: amenity, label: Picnic shelter }
attribution: Map data © OpenStreetMap contributors (ODbL)
tiles:
  # A dated Protomaps basemap build; only the tiles covering the park are read.
  source: https://build.protomaps.com/20261105.pmtiles
